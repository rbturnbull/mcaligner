[project]
name = "llmaligner"
version = "0.2.0"
description = "Word alignment of parallel texts with LLM agents, built on MCParser's corpus store and MCP server."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = { text = "Apache-2.0" }
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "mcparser",
    "pydantic-ai-slim[anthropic,mcp]>=2.56.0",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
llmaligner = "llmaligner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmaligner"]

[tool.uv.sources]
mcparser = { path = "../llmparser", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=llmaligner --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["llmaligner"]
branch = true

[tool.coverage.report]
precision = 2
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
