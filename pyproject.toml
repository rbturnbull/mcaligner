[project]
name = "mcaligner"
version = "0.2.0a1"
description = "Word alignment of parallel texts with LLM agents, built on MCParser's corpus store and MCP server."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = { text = "Apache-2.0" }
readme = "README.rst"
keywords = ["word alignment", "parallel texts", "LLM agents", "MCP", "digital humanities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
dependencies = [
    "mcparser>=0.2.0a1",
    "pydantic-ai-slim[anthropic,mcp]>=2.56.0",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/rbturnbull/mcaligner"
Documentation = "https://rbturnbull.github.io/mcaligner"
Issues = "https://github.com/rbturnbull/mcaligner/issues"

[project.scripts]
mcaligner = "mcaligner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcaligner"]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcaligner --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["mcaligner"]
branch = true

[tool.coverage.report]
precision = 2
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
